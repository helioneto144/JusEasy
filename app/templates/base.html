<!DOCTYPE html>
<html lang="pt-BR" class="dark" style="color-scheme: dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070A11">
    <meta name="description" content="JusEasy — Sistema de gestão de processos jurídicos com bot Telegram e IA">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
    <title>{% block title %}JusEasy{% endblock %} - Gestão de Processos</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            950: '#070A11',
                            900: '#0B0F19',
                            800: '#131B2C',
                            700: '#1C273D',
                            600: '#2A3A54',
                            500: '#3D5276',
                        },
                        accent: {
                            500: '#3B82F6',
                            600: '#2563EB',
                            glow: 'rgba(59, 130, 246, 0.5)'
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                        'fade-in-up': 'fadeInUp 0.4s cubic-bezier(0.23, 1, 0.32, 1) forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                    }
                }
            }
        }
    </script>
    <style>
        /* ── Easing curves ── */
        :root {
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
            --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
        }

        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-request .htmx-hide { display: none; }
        .htmx-indicator { display: none; }

        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-display { font-family: 'Outfit', sans-serif; }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1C273D; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #2A3A54; }

        /* ── Focus glow ── */
        textarea:focus, input:focus, select:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4), 0 0 15px rgba(59, 130, 246, 0.15);
            border-color: #3B82F6;
        }

        /* ── Button press feedback ── */
        button, [role="button"] {
            transition: transform 160ms var(--ease-out), background-color 200ms ease,
                        color 200ms ease, border-color 200ms ease, box-shadow 200ms ease,
                        opacity 200ms ease;
        }
        button:active, [role="button"]:active {
            transform: scale(0.97);
        }

        /* ── Links — specific properties, never 'all' ── */
        a {
            transition: color 200ms ease, background-color 200ms ease,
                        border-color 200ms ease, opacity 200ms ease,
                        transform 200ms var(--ease-out), box-shadow 200ms ease;
        }

        /* ── Hover lift — only on pointer devices ── */
        @media (hover: hover) and (pointer: fine) {
            .hover-lift { transition: transform 200ms var(--ease-out), box-shadow 300ms ease; }
            .hover-lift:hover { transform: translateY(-4px); }
        }

        /* ── Stagger fade-in ── */
        @keyframes staggerIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .stagger > * {
            opacity: 0;
            animation: staggerIn 300ms var(--ease-out) forwards;
        }
        .stagger > *:nth-child(1)  { animation-delay: 0ms; }
        .stagger > *:nth-child(2)  { animation-delay: 40ms; }
        .stagger > *:nth-child(3)  { animation-delay: 80ms; }
        .stagger > *:nth-child(4)  { animation-delay: 120ms; }
        .stagger > *:nth-child(5)  { animation-delay: 160ms; }
        .stagger > *:nth-child(6)  { animation-delay: 200ms; }
        .stagger > *:nth-child(7)  { animation-delay: 240ms; }
        .stagger > *:nth-child(8)  { animation-delay: 280ms; }
        .stagger > *:nth-child(9)  { animation-delay: 320ms; }
        .stagger > *:nth-child(10) { animation-delay: 360ms; }
        .stagger > *:nth-child(n+11) { animation-delay: 400ms; }

        /* ── Toast animations ── */
        @keyframes toastIn {
            from { transform: translateY(100%) scale(0.95); opacity: 0; }
            to   { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes toastOut {
            from { transform: translateY(0) scale(1); opacity: 1; }
            to   { transform: translateY(100%) scale(0.95); opacity: 0; }
        }
        .toast-enter { animation: toastIn 400ms var(--ease-out) forwards; }
        .toast-exit  { animation: toastOut 200ms ease-out forwards; }

        /* ── Progress bar for toast auto-dismiss ── */
        @keyframes toastProgress {
            from { transform: scaleX(1); }
            to   { transform: scaleX(0); }
        }

        /* ── Skeleton pulse ── */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: skeletonShimmer 1.5s ease-in-out infinite;
            border-radius: 0.75rem;
        }
        @keyframes skeletonShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ── Reduced motion ── */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-dark-950 text-slate-300 min-h-screen selection:bg-accent-500/30 selection:text-white"
      x-data="{ sidebarOpen: false }" @keydown.escape.window="sidebarOpen = false">

    <!-- Ambient glowing light effect -->
    <div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-accent-600/10 blur-[120px] pointer-events-none"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[30%] h-[30%] rounded-full bg-purple-600/10 blur-[100px] pointer-events-none"></div>

    <!-- ═══ Mobile Header ═══ -->
    <header class="md:hidden fixed top-0 inset-x-0 h-14 bg-dark-900/80 backdrop-blur-xl border-b border-white/5 z-40 flex items-center justify-between px-4">
        <button @click="sidebarOpen = !sidebarOpen" class="p-2 -ml-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/10" aria-label="Abrir menu">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <h1 class="text-lg font-bold font-display text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 flex items-center gap-2">
            <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
            </div>
            JusEasy
        </h1>
        <div class="w-10"></div>
    </header>

    <!-- ═══ Mobile Sidebar Overlay ═══ -->
    <div x-show="sidebarOpen"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="sidebarOpen = false"
         class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 md:hidden"
         style="display: none;"></div>

    <div class="flex h-screen overflow-hidden relative z-10">
        <!-- ═══ Sidebar ═══ -->
        <aside class="fixed inset-y-0 left-0 z-50 md:static md:z-20 w-64 bg-dark-900/80 backdrop-blur-xl border-r border-white/5 flex flex-col shadow-[4px_0_24px_rgba(0,0,0,0.2)] transform transition-transform duration-300"
               style="transition-timing-function: cubic-bezier(0.32, 0.72, 0, 1);"
               :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'">

            <div class="p-6 border-b border-white/5 flex items-center justify-between">
                <h1 class="text-2xl font-bold font-display text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                        </svg>
                    </div>
                    JusEasy
                </h1>
                <!-- Mobile close button -->
                <button @click="sidebarOpen = false" class="md:hidden p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/10" aria-label="Fechar menu">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <!-- Search -->
            <div class="px-4 pt-4" x-data="{ searchOpen: false, searchQuery: '' }">
                <div class="relative">
                    <input type="text" placeholder="Buscar..."
                           x-model="searchQuery"
                           @focus="searchOpen = true"
                           @keydown.escape="searchOpen = false; searchQuery = ''"
                           hx-get="/busca"
                           hx-trigger="keyup changed delay:300ms"
                           hx-target="#search-results"
                           hx-include="this"
                           name="q"
                           class="w-full bg-dark-800/60 border border-white/5 rounded-lg pl-9 pr-3 py-2 text-sm text-white placeholder-slate-500 focus:border-blue-500/30 focus:bg-dark-800">
                    <svg class="w-4 h-4 text-slate-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <div x-show="searchOpen && searchQuery.length >= 2"
                     @click.away="searchOpen = false"
                     x-transition:enter="transition ease-out duration-150"
                     x-transition:enter-start="opacity-0 -translate-y-1"
                     x-transition:enter-end="opacity-100 translate-y-0"
                     class="absolute left-4 right-4 mt-2 bg-dark-800 border border-white/10 rounded-xl shadow-2xl z-50 max-h-80 overflow-y-auto"
                     style="display: none;">
                    <div id="search-results"></div>
                </div>
            </div>

            <nav class="flex-1 p-4 overflow-y-auto">
                <ul class="space-y-2">
                    <li>
                        <a href="/" @click="sidebarOpen = false" class="flex items-center gap-3 px-4 py-3 rounded-xl group min-h-[44px] {% if request.url.path == '/' %}bg-white/10 text-white shadow-[0_0_15px_rgba(255,255,255,0.05)] border border-white/10{% else %}text-slate-400 hover:text-slate-200 hover:bg-white/5 border border-transparent{% endif %}">
                            <svg class="w-5 h-5 {% if request.url.path == '/' %}text-blue-400{% else %}text-slate-500 group-hover:text-blue-400{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                            <span class="font-medium">Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="/processos" @click="sidebarOpen = false" class="flex items-center gap-3 px-4 py-3 rounded-xl group min-h-[44px] {% if 'processos' in request.url.path or 'processo' in request.url.path %}bg-white/10 text-white shadow-[0_0_15px_rgba(255,255,255,0.05)] border border-white/10{% else %}text-slate-400 hover:text-slate-200 hover:bg-white/5 border border-transparent{% endif %}">
                            <svg class="w-5 h-5 {% if 'processos' in request.url.path or 'processo' in request.url.path %}text-blue-400{% else %}text-slate-500 group-hover:text-blue-400{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                            <span class="font-medium">Processos</span>
                        </a>
                    </li>
                    <li>
                        <a href="/intimacoes" @click="sidebarOpen = false" class="flex items-center gap-3 px-4 py-3 rounded-xl group min-h-[44px] {% if 'intimacoes' in request.url.path %}bg-white/10 text-white shadow-[0_0_15px_rgba(255,255,255,0.05)] border border-white/10{% else %}text-slate-400 hover:text-slate-200 hover:bg-white/5 border border-transparent{% endif %}">
                            <svg class="w-5 h-5 {% if 'intimacoes' in request.url.path %}text-amber-400{% else %}text-slate-500 group-hover:text-amber-400{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                            <span class="font-medium">Intimações</span>
                        </a>
                    </li>
                    <li>
                        <a href="/tarefas" @click="sidebarOpen = false" class="flex items-center gap-3 px-4 py-3 rounded-xl group min-h-[44px] {% if 'tarefas' in request.url.path %}bg-white/10 text-white shadow-[0_0_15px_rgba(255,255,255,0.05)] border border-white/10{% else %}text-slate-400 hover:text-slate-200 hover:bg-white/5 border border-transparent{% endif %}">
                            <svg class="w-5 h-5 {% if 'tarefas' in request.url.path %}text-green-400{% else %}text-slate-500 group-hover:text-green-400{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                            <span class="font-medium">Tarefas</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="p-4 border-t border-white/5 bg-dark-900/50">
                <button hx-post="/sync-intimacoes" hx-swap="none" class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 rounded-xl text-white font-medium shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 min-h-[44px]">
                    <svg class="w-4 h-4 animate-[spin_4s_linear_infinite] htmx-indicator" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <svg class="w-4 h-4 htmx-hide" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Sincronizar AASP
                </button>
            </div>
        </aside>

        <!-- ═══ Main Content ═══ -->
        <main class="flex-1 overflow-y-auto w-full relative pt-14 md:pt-0">
            <div class="p-4 sm:p-6 md:p-8 max-w-7xl mx-auto min-h-full flex flex-col animate-fade-in-up">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- ═══ Toast Container ═══ -->
    <div id="toast-container" class="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 z-[100] flex flex-col-reverse gap-2 pointer-events-none max-w-[90vw] sm:max-w-sm"></div>

<script>
    /* ── Toast System (Sonner-inspired) ── */
    function showToast(message, type) {
        type = type || 'success';
        var container = document.getElementById('toast-container');
        var toast = document.createElement('div');

        var colors = {
            success: { dot: 'bg-green-500', border: 'border-green-500/20', ring: 'shadow-green-500/10' },
            error:   { dot: 'bg-red-500',   border: 'border-red-500/20',   ring: 'shadow-red-500/10' },
            info:    { dot: 'bg-blue-500',  border: 'border-blue-500/20',  ring: 'shadow-blue-500/10' },
            warning: { dot: 'bg-amber-500', border: 'border-amber-500/20', ring: 'shadow-amber-500/10' }
        };
        var c = colors[type] || colors.success;

        toast.className = 'pointer-events-auto bg-dark-800/95 backdrop-blur-md border ' + c.border + ' text-white px-5 py-3 rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.5)] ' + c.ring + ' flex items-center gap-3 toast-enter';
        toast.innerHTML = '<div class="w-2 h-2 rounded-full ' + c.dot + ' flex-shrink-0"></div>' +
                          '<span class="font-medium text-sm">' + message + '</span>';

        container.appendChild(toast);

        /* Auto-dismiss */
        setTimeout(function() {
            toast.classList.remove('toast-enter');
            toast.classList.add('toast-exit');
            toast.addEventListener('animationend', function() { toast.remove(); });
        }, 4000);
    }

    /* ── YAML Download ── */
    function downloadYaml() {
        var codeEl = document.getElementById('yaml-code');
        if (!codeEl) return;
        var content = codeEl.innerText;
        var blob = new Blob([content], { type: 'text/yaml' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'processo.yml';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    /* ── HTMX: success toast ── */
    document.body.addEventListener('htmx:afterRequest', function(evt) {
        if (evt.detail.successful) {
            var msg = evt.detail.xhr.getResponseHeader('X-Toast');
            var type = evt.detail.xhr.getResponseHeader('X-Toast-Type') || 'success';
            if (msg) showToast(msg, type);
        }
    });

    /* ── HTMX: error handling ── */
    document.body.addEventListener('htmx:responseError', function() {
        showToast('Erro ao processar. Tente novamente.', 'error');
    });
    document.body.addEventListener('htmx:sendError', function() {
        showToast('Sem conexão com o servidor.', 'error');
    });
</script>
</body>
</html>
