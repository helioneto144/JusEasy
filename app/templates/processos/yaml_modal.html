<div class="flex flex-col h-full max-h-[85vh]">
    <div class="p-6 border-b border-white/5 flex items-center justify-between bg-dark-800/40 sticky top-0 z-10">
        <h3 class="text-xl font-semibold text-white font-display flex items-center gap-3">
            <div class="p-2 rounded-lg bg-emerald-500/20 text-emerald-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
            </div>
            Dados YAML para IA
        </h3>
        <button onclick="window.dispatchEvent(new CustomEvent('close-modal'))" class="p-2 text-slate-400 hover:text-white hover:bg-white/10 rounded-xl transition-all">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>
    
    <div class="p-6 flex-1 overflow-y-auto">
        <p class="text-sm text-slate-400 mb-6 leading-relaxed">
            Abaixo estão os dados estruturados do processo atual. <span class="text-slate-300 font-medium">Copie este bloco e cole em seu prompt</span> no ChatGPT ou Claude para analisar estrategicamente o caso, gerar petições ou identificar prazos ocultos.
        </p>
        
        <div class="relative group">
            <div class="absolute top-0 inset-x-0 h-10 bg-dark-950/80 rounded-t-xl border border-b-0 border-white/10 flex items-center px-4 justify-between z-10">
                <div class="flex gap-2">
                    <div class="w-3 h-3 rounded-full bg-red-500/20 border border-red-500/50"></div>
                    <div class="w-3 h-3 rounded-full bg-amber-500/20 border border-amber-500/50"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500/20 border border-green-500/50"></div>
                </div>
                <span class="text-[10px] uppercase tracking-widest text-slate-500 font-mono">processo.yml</span>
            </div>
            
            <pre class="bg-[#0D1117] border border-white/10 rounded-xl pt-14 pb-4 px-5 text-sm font-mono leading-relaxed overflow-x-auto shadow-inner text-emerald-400/90 selection:bg-emerald-500/30 selection:text-white"><code id="yaml-code">{{ yaml_content }}</code></pre>
            
            <button 
                type="button"
                onclick="downloadYaml()"
                class="absolute top-1 right-2 inline-flex items-center gap-2 px-3 py-1.5 bg-dark-700 hover:bg-dark-600 border border-white/10 text-white text-xs font-medium rounded-lg transition-all z-20 shadow-lg cursor-pointer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                <span>Baixar YAML</span>
            </button>
        </div>
    </div>
    
    <div class="p-6 border-t border-white/5 bg-dark-800/20 flex flex-col sm:flex-row items-center justify-end gap-4 rounded-b-2xl">
        <a href="https://chat.openai.com/" target="_blank"
           class="w-full sm:w-auto flex items-center justify-center gap-2 px-5 py-2.5 bg-white/5 hover:bg-white/10 border border-white/10 text-white font-medium rounded-xl transition-all group">
            <svg class="w-5 h-5 group-hover:scale-110 transition-transform" fill="currentColor" viewBox="0 0 24 24">
                <path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.8956zm16.0993 3.8558L12.6 8.3829l2.02-1.1638a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997z"/>
            </svg>
            Abrir ChatGPT
        </a>
        <a href="https://claude.ai/" target="_blank"
           class="w-full sm:w-auto flex items-center justify-center gap-2 px-6 py-2.5 bg-orange-600/20 hover:bg-orange-600/30 border border-orange-500/30 text-orange-400 hover:text-orange-300 font-medium rounded-xl transition-all group">
            <svg class="w-5 h-5 group-hover:scale-110 transition-transform" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
            </svg>
            Abrir Claude
        </a>
    </div>
</div>
