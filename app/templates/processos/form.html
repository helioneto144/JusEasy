{% extends "base.html" %}

{% block title %}Novo Processo{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="mb-8">
        <a href="/processos" class="inline-flex items-center gap-2 text-slate-400 hover:text-white transition-colors text-sm font-medium mb-4 bg-white/5 hover:bg-white/10 px-3 py-1.5 rounded-full border border-white/5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            Voltar para processos
        </a>
        <h2 class="text-3xl font-bold text-white font-display tracking-tight flex items-center gap-3">
            <div class="p-2 rounded-xl bg-blue-500/20 text-blue-400 shadow-[0_0_15px_rgba(59,130,246,0.2)]">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            </div>
            Cadastrar Novo Processo
        </h2>
    </div>

    <!-- Form Container -->
    <div class="bg-dark-900/40 backdrop-blur-xl rounded-2xl border border-white/5 shadow-[0_8px_30px_rgb(0,0,0,0.12)] p-8 relative overflow-hidden">
        <!-- Glow top edge -->
        <div class="absolute top-0 inset-x-0 h-px bg-gradient-to-r from-transparent via-blue-500/50 to-transparent"></div>
        
        <form action="/processo/novo" method="POST" class="space-y-8 relative z-10">
            <!-- Basic info section -->
            <div class="space-y-6">
                <div>
                    <h3 class="text-lg font-medium text-white font-display mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Informações Básicas
                    </h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-slate-300 mb-2">Número do Processo (CNJ) <span class="text-amber-500">*</span></label>
                            <input type="text" name="numero" required placeholder="0000000-00.0000.0.00.0000"
                                   class="w-full bg-dark-800/80 border border-white/10 rounded-xl px-4 py-3 text-white font-mono text-lg placeholder-slate-600 focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/50 shadow-inner transition-all">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Assunto Principal</label>
                            <input type="text" name="assunto" placeholder="Ex: Indenização por Danos Morais"
                                   class="w-full bg-dark-800/80 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/50 shadow-inner transition-all">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-2">Vara</label>
                                <input type="text" name="vara" placeholder="Ex: 1ª Vara Cível"
                                       class="w-full bg-dark-800/80 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/50 shadow-inner transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-2">Comarca</label>
                                <input type="text" name="comarca" placeholder="Ex: São Paulo"
                                       class="w-full bg-dark-800/80 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/50 shadow-inner transition-all">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white/[0.02] border border-white/5 rounded-xl p-6">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Síntese do Processo</label>
                    <p class="text-xs text-slate-500 mb-3">Resumo dos fatos para acompanhamento e exportação para IA.</p>
                    <textarea name="sintese" rows="5"
                              class="w-full bg-dark-800/80 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/50 shadow-inner transition-all resize-none"
                              placeholder="Descreva a história e estágio atual do processo..."></textarea>
                </div>
                
                <div>
                    <h3 class="text-lg font-medium text-white font-display mb-4 mt-8 flex items-center gap-2">
                        <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        Partes Envolvidas
                    </h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="relative">
                            <label class="block text-sm font-medium text-blue-300 mb-2">Polo Ativo (Autores)</label>
                            <textarea name="partes_autor" rows="4"
                                      class="w-full bg-dark-800/80 border border-blue-500/20 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/50 shadow-inner transition-all resize-none"
                                      placeholder="Um nome por linha..."></textarea>
                            <div class="absolute inset-0 bg-blue-500/5 rounded-xl pointer-events-none"></div>
                        </div>
                        <div class="relative">
                            <label class="block text-sm font-medium text-amber-300 mb-2">Polo Passivo (Réus)</label>
                            <textarea name="partes_reu" rows="4"
                                      class="w-full bg-dark-800/80 border border-amber-500/20 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:border-amber-500/50 focus:ring-1 focus:ring-amber-500/50 shadow-inner transition-all resize-none"
                                      placeholder="Um nome por linha..."></textarea>
                            <div class="absolute inset-0 bg-amber-500/5 rounded-xl pointer-events-none"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="pt-6 border-t border-white/5 flex flex-col sm:flex-row items-center gap-4 justify-end">
                <a href="/processos" class="w-full sm:w-auto px-6 py-3 bg-dark-800 hover:bg-dark-700 text-slate-300 hover:text-white rounded-xl font-medium transition-all border border-white/5">
                    Cancelar
                </a>
                <button type="submit" class="w-full sm:w-auto px-8 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl font-medium shadow-[0_4px_14px_0_rgba(59,130,246,0.39)] hover:shadow-[0_6px_20px_rgba(59,130,246,0.23)] hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    Cadastrar Processo
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
