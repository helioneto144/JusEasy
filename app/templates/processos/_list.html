<div class="overflow-x-auto min-h-[400px]">
<table class="w-full whitespace-nowrap">
    <thead class="bg-dark-800/40 border-b border-white/5 sticky top-0 z-10 backdrop-blur-md">
        <tr>
            <th scope="col"
                class="px-6 py-4 text-left text-xs font-semibold font-display text-slate-400 uppercase tracking-widest w-1/4">
                Número CNJ
            </th>
            <th scope="col"
                class="px-6 py-4 text-left text-xs font-semibold font-display text-slate-400 uppercase tracking-widest w-1/3">
                Assunto Principal
            </th>
            <th scope="col"
                class="px-6 py-4 text-left text-xs font-semibold font-display text-slate-400 uppercase tracking-widest flex-1">
                Vara / Comarca
            </th>
            <th scope="col"
                class="px-6 py-4 text-right text-xs font-semibold font-display text-slate-400 uppercase tracking-widest w-24">
                Ações
            </th>
        </tr>
    </thead>
    <tbody class="divide-y divide-white/5">
        {% for processo in processos %}
        <tr class="hover:bg-white/[0.02] transition-colors group">
            <td class="px-6 py-5">
                <a href="/processo/{{ processo.id }}"
                    class="inline-flex items-center gap-2 group-hover:text-blue-300 transition-colors">
                    <span
                        class="w-2 h-2 rounded-full bg-blue-500/50 group-hover:bg-blue-400 shadow-[0_0_8px_rgba(59,130,246,0.5)]"></span>
                    <span class="text-blue-400 font-mono font-medium tracking-wide">{{ processo.numero }}</span>
                </a>
            </td>
            <td class="px-6 py-5 text-slate-300">
                <div class="truncate max-w-sm" title="{{ processo.assunto }}">
                    {{ processo.assunto or "-" }}
                </div>
            </td>
            <td class="px-6 py-5">
                <div class="flex flex-col">
                    <span class="text-slate-300 font-medium">{{ processo.vara or "-" }}</span>
                    <span class="text-slate-500 text-sm flex items-center gap-1 mt-0.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z">
                            </path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        {{ processo.comarca or "-" }}
                    </span>
                </div>
            </td>
            <td class="px-6 py-5 text-right">
                <div class="flex items-center justify-end">
                    <a href="/processo/{{ processo.id }}"
                        class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition-all"
                        title="Ver detalhes">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                            </path>
                        </svg>
                    </a>
                </div>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="4">
                <div class="flex flex-col items-center justify-center p-12 text-slate-500">
                    <svg class="w-16 h-16 mb-4 text-slate-600/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                        </path>
                    </svg>
                    <p class="text-lg font-medium text-slate-400">Nenhum processo encontrado</p>
                    <p class="text-sm mt-1">Tente ajustar seus termos de busca</p>
                </div>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>
