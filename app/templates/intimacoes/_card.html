<div class="p-4 rounded-xl transition-colors hover:bg-white/5 {{ 'bg-amber-500/[0.03] border border-amber-500/10' if not intimacao.lida else 'border border-transparent' }} m-2 group relative">
    <div class="flex items-center justify-between mb-3">
        <span class="text-xs font-semibold tracking-wider uppercase {{ 'text-amber-400' if not intimacao.lida else 'text-slate-500' }}">
            {{ intimacao.data_disponibilizacao }}
        </span>
        {% if not intimacao.lida %}
        <button hx-post="/intimacao/{{ intimacao.id }}/ler" 
                hx-swap="outerHTML" hx-target="closest div.p-4"
                class="text-[10px] font-bold uppercase tracking-wider px-3 py-1.5 bg-amber-500/10 text-amber-400 rounded-lg border border-amber-500/20 hover:bg-amber-500/20 hover:text-amber-300 transition-all z-10 relative">
            Marcar como Lida
        </button>
        {% endif %}
    </div>
    <p class="text-sm leading-relaxed whitespace-pre-wrap {{ 'text-white' if not intimacao.lida else 'text-slate-300 group-hover:text-slate-200' }}">{{ intimacao.conteudo }}</p>
    {% if intimacao.diario_oficial %}
    <div class="mt-4 pt-4 border-t border-white/5 flex items-center gap-2">
        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
        <p class="text-xs text-slate-500">{{ intimacao.diario_oficial }}</p>
    </div>
    {% endif %}
</div>
